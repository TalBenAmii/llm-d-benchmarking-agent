<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" role="img" aria-label="Deployment diagram: a browser chat UI on the host reaches the agent service pod in a Kubernetes cluster via port-forward on port 8000. The pod holds the agent loop, knowledge files, the tool registry, read-only upstream repos baked into the image, and a guardrail layer; it talks to an external LLM provider and shells out to the llmdbenchmark CLI, which deploys the llm-d stack and runs benchmarks in a plan-chosen namespace. Raw results land in the workspace mount, are parsed against the Benchmark Report v0.2 schema in the backend, and are explained to the user.">
      <style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}

  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #16232e;
    --muted: #5b6b78;
    --line: #d3dce3;
    --accent: #2b5fd9;
    --accent-soft: #e8eefb;
    --gate: #a8580b;
    --gate-bg: #fbf3e7;
    --upstream: #6d5ca8;
    --upstream-bg: #f1eef9;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161c; --surface: #18212a; --ink: #e7edf2; --muted: #94a3b0;
      --line: #2c3945; --accent: #7ba0f2; --accent-soft: #1d2a42;
      --gate: #e0a458; --gate-bg: #2a2115; --upstream: #a99dd6; --upstream-bg: #241f33;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f6f8; --surface: #ffffff; --ink: #16232e; --muted: #5b6b78;
    --line: #d3dce3; --accent: #2b5fd9; --accent-soft: #e8eefb;
    --gate: #a8580b; --gate-bg: #fbf3e7; --upstream: #6d5ca8; --upstream-bg: #f1eef9;
  }
  :root[data-theme="dark"] {
    --bg: #10161c; --surface: #18212a; --ink: #e7edf2; --muted: #94a3b0;
    --line: #2c3945; --accent: #7ba0f2; --accent-soft: #1d2a42;
    --gate: #e0a458; --gate-bg: #2a2115; --upstream: #a99dd6; --upstream-bg: #241f33;
  }

  body { background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
  .page { max-width: 1220px; margin: 0 auto; padding: 40px 24px 56px; }

  header { margin-bottom: 28px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  h1 { font-size: 30px; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }

  .diagram-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 14px 8px; overflow-x: auto; }
  .diagram-card svg { display: block; min-width: 940px; width: 100%; height: auto; }

  .legend { display: flex; flex-wrap: wrap; gap: 18px; padding: 12px 6px 4px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .swatch { width: 18px; height: 12px; border-radius: 3px; flex: none; }
  .swatch.owned { background: var(--surface); border: 1.5px solid var(--ink); }
  .swatch.up { background: var(--upstream-bg); border: 1.5px dashed var(--upstream); }
  .swatch.gate { background: var(--gate-bg); border: 1.5px solid var(--gate); }
  .swatch.ext { background: var(--surface); border: 1.5px dashed var(--muted); }
  .swatch.ret { background: none; border: none; border-top: 2px dashed var(--accent); height: 0; margin-top: 5px; }

  h2 { font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 36px 0 14px; }

  .flow { display: flex; flex-wrap: wrap; gap: 8px; }
  .step { flex: 1 1 120px; min-width: 118px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .step .n { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  .step .t { font-weight: 600; font-size: 14px; margin: 2px 0; }
  .step .d { font-size: 12px; color: var(--muted); }
  .step.gated { border-color: var(--gate); background: var(--gate-bg); }
  .step.gated .n { color: var(--gate); }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  .col ul { list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; }
  .col li { padding-left: 16px; position: relative; }
  .col li::before { content: ""; position: absolute; left: 0; top: 8px; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
  .col li b { font-weight: 600; }

  .numbers { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .numbers b { color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; margin-right: 5px; }

  /* SVG shared styles */
  .box { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; }
  .box-up { fill: var(--upstream-bg); stroke: var(--upstream); stroke-width: 1.4; stroke-dasharray: 5 4; }
  .box-gate { fill: var(--gate-bg); stroke: var(--gate); stroke-width: 1.4; }
  .box-ext { fill: var(--surface); stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
  .container-host { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; }
  .container-cluster { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; opacity: 0.55; }
  .container-pod { fill: var(--surface); stroke: var(--ink); stroke-width: 1.3; }
  .bt { font-family: var(--sans); font-size: 14px; font-weight: 600; fill: var(--ink); }
  .bs { font-family: var(--sans); font-size: 11px; fill: var(--muted); }
  .lb { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
  .cl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; fill: var(--accent); }
  .cl-ink { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; fill: var(--ink); }
  .cl-mut { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; fill: var(--muted); }
  .wire { stroke: var(--ink); stroke-width: 1.4; fill: none; }
  .wire-soft { stroke: var(--muted); stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
  .wire-ret { stroke: var(--accent); stroke-width: 1.6; fill: none; stroke-dasharray: 7 5; }

:root{--surface:#ffffff;--ink:#16232e;--muted:#5b6b78;--accent:#2b5fd9;--accent-soft:#e8eefb;--gate:#a8580b;--gate-bg:#fbf3e7;--upstream:#6d5ca8;--upstream-bg:#f1eef9;}</style><defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
        </marker>
        <marker id="arr-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
        </marker>
        <marker id="arr-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
        </marker>
      </defs>

      <!-- ===== external LLM provider ===== -->
      <rect class="box-ext" x="420" y="8" width="320" height="40" rx="8"/>
      <text class="bt" x="580" y="33" text-anchor="middle">Claude / Codex provider (external)</text>

      <line class="wire" x1="482" y1="48" x2="482" y2="170" marker-start="url(#arr)" marker-end="url(#arr)"/>
      <text class="lb" x="492" y="86">prompts / tool calls</text>

      <!-- ===== host ===== -->
      <rect class="container-host" x="30" y="96" width="250" height="220" rx="10"/>
      <text class="cl-mut" x="50" y="122">HOST</text>

      <rect class="box" x="50" y="140" width="210" height="48" rx="8"/>
      <text class="bt" x="155" y="169" text-anchor="middle">User (non-expert)</text>

      <line class="wire" x1="155" y1="188" x2="155" y2="212" marker-end="url(#arr)"/>

      <rect class="box" x="50" y="214" width="210" height="48" rx="8"/>
      <text class="bt" x="155" y="243" text-anchor="middle">Browser chat UI</text>


      <text class="lb" x="301" y="275" text-anchor="middle">WS :8000</text>

      <!-- ===== cluster ===== -->
      <rect class="container-cluster" x="320" y="96" width="830" height="416" rx="10"/>
      <text class="cl" x="620" y="122">CLUSTER · kind CPU-sim or GPU</text>

      <!-- agent service pod -->
      <rect class="container-pod" x="345" y="136" width="520" height="346" rx="10"/>
      <text class="cl-ink" x="620" y="156">AGENT SERVICE POD</text>

      <rect class="box" x="370" y="172" width="225" height="64" rx="8"/>
      <text class="bt" x="482" y="196" text-anchor="middle">Agent loop</text>
      <text class="bs" x="482" y="216" text-anchor="middle">FastAPI · Claude / Codex SDK</text>

      <rect class="box" x="620" y="172" width="220" height="64" rx="8"/>
      <text class="bt" x="730" y="196" text-anchor="middle">knowledge/</text>
      <text class="bs" x="730" y="216" text-anchor="middle">core prompt + on-demand md/yaml</text>

      <line class="wire" x1="618" y1="204" x2="599" y2="204" marker-end="url(#arr)"/>

      <rect class="box" x="370" y="264" width="225" height="58" rx="8"/>
      <text class="bt" x="482" y="287" text-anchor="middle">Tool registry</text>
      <text class="bs" x="482" y="305" text-anchor="middle">shared tools · schema-validated args</text>

      <line class="wire" x1="482" y1="236" x2="482" y2="262" marker-end="url(#arr)"/>

      <rect class="box-up" x="620" y="264" width="220" height="58" rx="8"/>
      <text class="bt" x="730" y="287" text-anchor="middle">/repos · upstream</text>
      <text class="bs" x="730" y="305" text-anchor="middle">read-only source + benchmark CLI</text>

      <rect class="box-gate" x="370" y="350" width="470" height="62" rx="8"/>
      <text class="bt" x="605" y="370" text-anchor="middle" fill="var(--gate)">Validation &amp; execution controls</text>
      <text class="bs" x="605" y="388" text-anchor="middle">dedicated commands: policy · shell: classifier · approvals by default</text>
      <text class="bs" x="605" y="403" text-anchor="middle">results parsed from the Benchmark Report v0.2 schema, never log-scraped</text>

      <line class="wire" x1="482" y1="322" x2="482" y2="348" marker-end="url(#arr)"/>

      <line class="wire" x1="730" y1="348" x2="730" y2="324" marker-end="url(#arr)"/>
      <text class="lb" x="738" y="341">shells out</text>

      <!-- writable mounts -->
      <line class="wire-soft" x1="605" y1="412" x2="605" y2="428" marker-end="url(#arr-soft)"/>
      <rect class="box" x="370" y="430" width="470" height="40" rx="8"/>
      <text class="bt" x="605" y="455" text-anchor="middle">/workspace + /tmp · the pod's only writable mounts</text>

      <!-- llm-d stack + runs -->
      <line class="wire" x1="842" y1="293" x2="893" y2="293" marker-end="url(#arr)"/>
      <text class="lb" x="1010" y="252" text-anchor="middle">standup · run</text>

      <rect class="box" x="895" y="264" width="230" height="58" rx="8"/>
      <text class="bt" x="1010" y="287" text-anchor="middle">llm-d stack + runs</text>
      <text class="bs" x="1010" y="305" text-anchor="middle">plan-chosen namespace · sweeps · retry</text>

      <path class="wire" d="M1010,322 V450 H844" marker-end="url(#arr)"/>
      <text class="lb" x="1018" y="345">raw results</text>

      <!-- ===== return path ===== -->
      <path class="wire-ret" d="M605,470 V544 H20 V238 H46" marker-end="url(#arr-acc)"/>
      <text class="lb" x="580" y="536" text-anchor="middle" fill="var(--accent)">results explained to the user</text>
      <!-- Redraw connections above container fills for print clarity. -->
      <line class="wire" x1="482" y1="48" x2="482" y2="170" marker-start="url(#arr)" marker-end="url(#arr)"/>
      <path class="wire" d="M260,238 H330 V204 H368" marker-end="url(#arr)"/>
    </svg>
